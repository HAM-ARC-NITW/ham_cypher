<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter the Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">

  <div class="plate">
    <div id="persistent-timer" class="cipher-timer">Time Elapsed: 00:00</div>
    <h1>Enter the Cipher</h1>
    <p>Five leads. Five letters. Work each one, then align the rings and speak the name only the Family trusts.</p>
  </div>

  <div class="leads">
    <div class="leads-label">Your Leads</div>
    <div class="stations" id="stationsList"></div>
  </div>

  <div class="cryptex-row">
    <div class="endcap left"></div>
    <div style="position:relative;">
      <div class="rod"></div>
      <div id="rings"></div>
    </div>
    <div class="endcap right"></div>
  </div>

  <div class="controls">
    <button class="pull-btn" id="pullBtn">Pull to Open</button>
    <div class="indicator" id="indicator"></div>
    <div class="resist" id="resist">The mechanism resists.</div>
  </div>

  <div id="reveal">
    <div class="seal"></div>
    <div class="scroll">
      <h2>The Cipher Is Broken</h2>
      <p>The person your'e looking for is NOT a woman</p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
